<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6B4226">
  <meta name="description" content="Abacus AI for Kids — an offline-first wooden-soroban learning adventure.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tutor.css">
  <title>Abacus AI for Kids</title>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <noscript>Please enable JavaScript to use Abacus AI for Kids.</noscript>
  <script>
    // Never leave a child staring at a blank screen. If the app module fails
    // to load/execute, show a recoverable screen instead of a silent failure.
    window.__abacusBootFailed = function (message) {
      const app = document.getElementById('app');
      if (!app || app.dataset.bootShown === '1') return;
      app.dataset.bootShown = '1';
      app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:#FAF6EE;color:#4B2C18;font-family:ui-rounded,Arial,sans-serif"><div style="max-width:420px"><div style="font-size:56px">🧮</div><h1 style="margin:8px 0">Babi is waking up…</h1><p style="line-height:1.5;color:#75685D">The Abacus World did not load correctly. Let’s try a fresh start.</p><button onclick="location.reload()" style="border:0;border-radius:14px;padding:14px 22px;background:#6B4226;color:#fff;font:900 17px ui-rounded,Arial,sans-serif">Try Again</button><p style="font-size:11px;color:#9A8B7C;margin-top:16px">'+String(message||'App startup error').replace(/[<>]/g,'')+'</p></div></div>';
    };
    window.addEventListener('error', function () {
      if (!document.getElementById('app')?.children.length) window.__abacusBootFailed('Startup error');
    });
    window.addEventListener('unhandledrejection', function () {
      if (!document.getElementById('app')?.children.length) window.__abacusBootFailed('Startup error');
    });
    setTimeout(function () {
      const app = document.getElementById('app');
      if (app && !app.children.length) window.__abacusBootFailed('The app took too long to start');
    }, 6000);
  </script>
  <script type="module">
    import('./challengeApp.js?v=20260914-boot10').catch(function (err) {
      window.__abacusBootFailed(err && err.message ? err.message : 'Module failed to load');
    });
  </script>
  <script src="interactionFix.js?v=20260914-boot10"></script>
  <script type="module" src="sound.js?v=20260914-boot10"></script>
</body>
</html>
