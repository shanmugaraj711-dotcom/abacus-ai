name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Syntax
        run: npm run syntax

      - name: Run Coupon & Payment Tests
        run: npm run test:coupons

      - name: Run Complete Test Suite
        run: npm run test:all

      - name: Run Auth & Guest Mode Tests
        run: node tests/auth-guest.test.mjs

      - name: Run Audio & Tamil Localization Tests
        run: node tests/audio-tamil.test.mjs
