<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6B4226">
<meta name="description" content="Abacus AI for Kids — an offline-first wooden-soroban learning adventure.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tutor.css">
<title>Abacus AI for Kids</title>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="screen onboarding" id="onboardingShell">
    <div class="ob-brand">🧮 <b>Abacus AI</b><small>My Abacus World</small></div>
    <svg class="babi babi-hero babi-idle" viewBox="0 0 160 160" aria-label="Babi"><use href="./assets/mascot/babi.svg#idle"></use></svg>
    <h1>Let's build your Abacus World!</h1>
    <p class="ob-sub">Babi will learn how to help you.</p>
    <div class="ob-card">
      <label for="childName">What's your name?</label>
      <input id="childName" maxlength="18" autocomplete="off" placeholder="Your first name">
      <label>How old are you?</label>
      <div class="age-grid">
        <button type="button" data-age="3-5">3–5</button>
        <button type="button" data-age="6-8">6–8</button>
        <button type="button" data-age="8-10">8–10</button>
        <button type="button" data-age="10+">10+</button>
      </div>
      <label>Have you used an abacus before?</label>
      <div class="experience">
        <button type="button" data-exp="new"><b>🌱 I'm new</b><small>Teach me from the beginning</small></button>
        <button type="button" data-exp="known"><b>🚀 I know abacus</b><small>Give me a quick challenge</small></button>
      </div>
      <button type="button" class="primary" id="obNext" disabled>Enter My World →</button>
    </div>
    <div class="footer">Powered by PromptStudioAI<br><small>promptstudioai.in</small></div>
  </div>
</main>
<noscript>Please enable JavaScript to save your profile and enter Abacus World.</noscript>
<script defer src="boot.js?v=20260915-shell1"></script>
</body>
</html>
