<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6B4226">
<meta name="description" content="Install Abacus AI — your child's Abacus World.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Install Abacus AI</title>
<style>
body{margin:0;background:#FAF6EE;color:#4B2C18;font-family:ui-rounded,system-ui,-apple-system,sans-serif}.install{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(520px,100%);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 12px 40px rgba(75,44,24,.12)}.babi{font-size:72px}.logo{font-size:42px}.card h1{margin:8px 0;font-size:30px}.sub{opacity:.75;line-height:1.5}.install-btn{width:100%;border:0;border-radius:18px;padding:17px 20px;background:#6B4226;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.install-btn:disabled{opacity:.65}.steps{margin-top:18px;padding:14px;border-radius:16px;background:#FAF6EE;text-align:left;font-size:14px;line-height:1.6}.small{font-size:12px;opacity:.6;margin-top:18px}
</style>
</head>
<body><main class="install"><section class="card"><div class="logo">🧮</div><div class="babi">🐻</div><h1>Install Abacus AI</h1><p class="sub">Put your child's Abacus World right on the home screen.<br>Works offline after installation.</p><button class="install-btn" id="install" type="button">📲 Install Abacus AI</button><div class="steps" id="steps" hidden><b>Chrome:</b><br>1. Tap <b>⋮</b> in Chrome.<br>2. Choose <b>Add to Home screen</b> or <b>Install app</b>.<br>3. Tap <b>Install</b>.</div><p class="small">No account required.</p></section></main>
<script>
let deferredPrompt=null;const btn=document.getElementById('install'),steps=document.getElementById('steps');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.disabled=false;});
btn.onclick=async()=>{if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;await p.prompt();try{await p.userChoice}catch{}return}steps.hidden=false;btn.textContent='Open Abacus AI →';btn.onclick=()=>location.href='./';};
window.addEventListener('appinstalled',()=>{btn.textContent='Installed ✓';btn.disabled=true;});
</script></body></html>
